[4:05 am, 17/11/2026] احمد: <!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نظام إدارة نتائج الطلاب</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"

        rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="styles.css">

</head>

<body class="bg-light">

    <div class="container mt-5">

        <h1 class="text-center mb-4">

            نظام إدارة نتائج الطلاب

        </h1>

        <!-- صندوق الأخطاء -->

        <div id="errorBox"

            class="alert alert-danger d-none">

        </div>

        <!-- نموذج إضافة طالب -->

        <div class="card p-4 shadow">

            <div class="mb-3">

                <label class="form-label">اسم الطالب</label>

                <input type="text" id="studentName"

                    class="form-control"

                    placeholder="أدخل اسم الطالب">

            </div>

            <div class="row">

                <div class="col-md-4 mb-3">

                    <label>درجة المادة الأولى</label>

                    <input type="number" id="grade1"

                        class="form-control">

                </div>

                <div class="col-md-4 mb-3">

                    <label>درجة المادة الثانية</label>

                    <input type="number" id="grade2"

                        class="form-control">

                </div>

                <div class="col-md-4 mb-3">

                    <label>درجة المادة الثالثة</label>

                    <input type="number" id="grade3"

                        class="form-control">

                </div>

            </div>

            <div class="mb-3">

                <label>نسبة الحضور</label>

                <input type="number" id="attendance"

                    class="form-control"

                    placeholder="من 0 إلى 100">

            </div>

            <button id="addStudentBtn"

                class="btn btn-primary">

                إضافة طالب

            </button>

            <button id="graceCommitteeBtn"

                class="btn btn-success mt-2">

                تفعيل لجنة الرأفة

            </button>

        </div>

        <!-- قائمة الطلاب -->

        <div class="mt-4">

            <h3>قائمة الطلاب</h3>

            <div id="studentsList"

                class="border p-3 bg-white">

            </div>

        </div>

        <!-- تقرير لجنة الرأفة -->

        <div class="mt-4">

            <h3>تقرير لجنة الرأفة</h3>

            <div id="reportBox"

                class="border p-3 bg-white">

            </div>

        </div>

    </div>

    <!-- JavaScript -->

    <script src="main.js"></script>

</body>

</html>
